<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="寶寶成長紀錄">
  <meta name="theme-color" content="#FF8B94">
  <title>Luka's 小王子飲食成長紀錄</title>
  
	<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/keliguru/track-food/refs/heads/main/food-icon.png">
	<meta property="og:type" content="website">
	<meta property="og:title" content="Luka's 小王子飲食成長紀錄">
	<meta property="og:description" content="Luka's 小王子飲食成長紀錄！">
	<meta property="og:image" content="https://raw.githubusercontent.com/keliguru/track-food/refs/heads/main/food-icon.png"> 
	<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/keliguru/track-food/refs/heads/main/food-icon.png">

  <!-- 載入 Google Fonts 兒童童趣字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700;800&family=Short+Stack&display=swap" rel="stylesheet">

  <!-- 載入 Chart.js 圖表庫 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      /* 手繪紙張與色彩變數 */
      --bg-gradient: #fcf8f2;
      --card-bg: #ffffff;
      --pencil-color: #2c2825;
      --text-main: #2c2825;
      --text-sub: #786f68;
      --input-bg: #fbf9f4;
      --input-focus-bg: #ffffff;
      --label-color: #4a423a;
      
      --accent-yellow: #ffe66d;
      --accent-pink: #ff8b94;
      --accent-green: #a8e6cf;
      --accent-blue: #9bf6ff;
      --accent-purple: #bdb2ff;

      --shadow-color: #2c2825;
      --tab-bg: #f0eae1;
      --tab-active-bg: #ffffff;
      --tab-active-color: #d94e67;
      --log-bg: #ffffff;
    }

    body.dark-mode {
      --bg-gradient: #1c1a19;
      --card-bg: #2a2624;
      --pencil-color: #f3ece4;
      --text-main: #f3ece4;
      --text-sub: #b3a89e;
      --input-bg: #1f1c1b;
      --input-focus-bg: #2a2624;
      --label-color: #dfd5c9;

      --shadow-color: #000000;
      --tab-bg: #1f1c1b;
      --tab-active-bg: #38322e;
      --tab-active-color: #ff8b94;
      --log-bg: #25211f;
    }

    * { 
      box-sizing: border-box; 
      font-family: 'Short Stack', 'Fredoka', "粉圓", "芫荽", -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body { 
      background-color: var(--bg-gradient);
      padding: 16px 12px; 
      color: var(--text-main); 
      margin: 0; 
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* 隱藏 SVG 濾鏡容器 */
    .svg-filters {
      position: absolute;
      width: 0;
      height: 0;
    }

    /* 手繪質感主卡片 */
    .card { 
      width: 100%;
      max-width: 440px; 
      background: var(--card-bg); 
      padding: 22px 18px; 
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
      border: 3.5px solid var(--pencil-color);
      box-shadow: 6px 6px 0px var(--shadow-color);
      filter: url('#hand-drawn-stroke');
      transition: background 0.3s ease;
    }

    .top-controls {
      display: flex;
      justify-content: flex-end;
      gap: 6px;
      margin-bottom: 12px;
    }

    .control-btn {
      background: var(--card-bg);
      border: 2.5px solid var(--pencil-color);
      padding: 6px 10px;
      border-radius: 20px 8px 16px 10px;
      font-size: 13px;
      font-weight: bold;
      color: var(--text-main);
      box-shadow: 3px 3px 0px var(--shadow-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.1s ease;
    }

    .control-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0px var(--shadow-color);
    }

    .header {
      text-align: center;
      margin-bottom: 16px;
    }

    .header h2 { 
      margin: 0; 
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 23px; 
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    /* 身高體重手繪橫幅 */
    .hw-banner {
      background: var(--accent-yellow);
      color: #2c2825;
      border: 3px solid var(--pencil-color);
      box-shadow: 4px 4px 0px var(--shadow-color);
      border-radius: 18px 25px 16px 20px;
      padding: 10px 14px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    body.dark-mode .hw-banner {
      background: #8e7d23;
      color: #f3ece4;
    }

    .hw-title {
      font-size: 13px;
      font-weight: 800;
    }

    .hw-date {
      font-size: 12px;
      font-weight: bold;
      opacity: 0.85;
    }

    .hw-values {
      font-family: 'Fredoka', sans-serif;
      font-size: 16px;
      font-weight: 800;
      margin-top: 2px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-box-milk {
      background: var(--accent-blue);
      color: #2c2825;
      border: 3px solid var(--pencil-color);
      box-shadow: 4px 4px 0px var(--shadow-color);
      border-radius: 20px 10px 22px 12px;
      padding: 12px 10px;
      text-align: center;
    }

    body.dark-mode .stat-box-milk {
      background: #236c74;
      color: #f3ece4;
    }

    .stat-box-meal {
      background: var(--accent-green);
      color: #2c2825;
      border: 3px solid var(--pencil-color);
      box-shadow: 4px 4px 0px var(--shadow-color);
      border-radius: 12px 22px 10px 20px;
      padding: 12px 10px;
      text-align: center;
    }

    body.dark-mode .stat-box-meal {
      background: #27624b;
      color: #f3ece4;
    }

    .stat-label {
      font-size: 13px;
      font-weight: 700;
    }

    .stat-value {
      font-family: 'Fredoka', sans-serif;
      font-size: 22px;
      font-weight: 800;
      margin-top: 2px;
    }

    .tab-group {
      display: flex;
      background: var(--tab-bg);
      border: 3px solid var(--pencil-color);
      box-shadow: 3px 3px 0px var(--shadow-color);
      border-radius: 22px 12px 20px 14px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-weight: 700;
      font-size: 14px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-color);
      border: 2px solid var(--pencil-color);
      box-shadow: 2px 2px 0px var(--shadow-color);
    }

    .view-toggle-group {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .view-btn {
      flex: 1;
      padding: 8px;
      border: 2.5px solid var(--pencil-color);
      background: var(--card-bg);
      color: var(--text-main);
      font-weight: bold;
      font-size: 13px;
      border-radius: 16px 6px 14px 8px;
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--shadow-color);
      transition: all 0.15s ease;
    }

    .view-btn.active {
      background: var(--accent-yellow);
      color: #2c2825;
      box-shadow: 3px 3px 0px var(--shadow-color);
    }

    .chart-card {
      background: var(--log-bg);
      border: 2.5px solid var(--pencil-color);
      box-shadow: 4px 4px 0px var(--shadow-color);
      border-radius: 20px 8px 18px 10px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .chart-title {
      font-size: 14px;
      font-weight: bold;
      margin-top: 0;
      margin-bottom: 10px;
      text-align: center;
      color: var(--text-main);
    }

    .form-group { 
      margin-bottom: 16px; 
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group {
      flex: 1;
    }

    label { 
      display: block; 
      margin-bottom: 6px; 
      font-weight: 700; 
      font-size: 14px; 
      color: var(--label-color); 
    }

    input, select, textarea { 
      width: 100%; 
      padding: 12px 14px; 
      border: 2.5px solid var(--pencil-color); 
      border-radius: 18px 8px 16px 10px; 
      font-size: 15px; 
      background: var(--input-bg);
      color: var(--text-main);
      outline: none; 
      transition: all 0.2s ease;
      -webkit-appearance: none;
    }

    input:focus, select:focus, textarea:focus { 
      background: var(--input-focus-bg);
      box-shadow: 3px 3px 0px var(--shadow-color);
    }

    .quick-title { 
      font-size: 13px; 
      color: var(--text-sub); 
      margin-top: 14px; 
      margin-bottom: 8px; 
      font-weight: 700;
    }

    .chips-container { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 8px; 
    }

    .chip { 
      padding: 7px 13px; 
      border-radius: 16px 6px 14px 8px; 
      font-size: 13px; 
      font-weight: 800;
      cursor: pointer; 
      user-select: none;
      transition: all 0.15s ease;
      border: 2px solid var(--pencil-color);
      box-shadow: 2px 2px 0px var(--shadow-color);
      color: #2c2825;
    }

    .chip:active { 
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--shadow-color);
    }

    .chip-c1 { background: #ffc6ff; } 
    .chip-c2 { background: #ffd6a5; } 
    .chip-c3 { background: #fdffb6; } 
    .chip-c4 { background: #caffbf; } 
    .chip-c5 { background: #9bf6ff; } 

    body.dark-mode .chip { color: #2c2825; }

    .chip-item { background: #e8e8e8; } 
    body.dark-mode .chip-item { background: #d0c8bf; }

    .submit-btn { 
      width: 100%; 
      padding: 15px; 
      background: var(--accent-pink); 
      color: #2c2825; 
      border: 3px solid var(--pencil-color); 
      border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px; 
      font-size: 18px; 
      font-family: 'Fredoka', cursive, sans-serif;
      font-weight: bold; 
      cursor: pointer; 
      margin-top: 14px; 
      box-shadow: 5px 5px 0px var(--shadow-color);
      transition: all 0.1s ease;
    }

    body.dark-mode .submit-btn {
      color: #2c2825;
    }

    .submit-btn:active {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0px var(--shadow-color);
    }

    .submit-btn:disabled { 
      background: #cbd5e1; 
      box-shadow: none;
      transform: none;
    }

    #msg { 
      text-align: center; 
      font-weight: bold; 
      font-size: 14px; 
    }

    #msg:empty {
      display: none;
    }

    #msg.success { 
      margin-top: 14px; 
      color: #1e6b36; 
      background-color: var(--accent-green); 
      border: 2.5px solid var(--pencil-color);
      padding: 10px;
      border-radius: 16px;
      box-shadow: 3px 3px 0px var(--shadow-color);
    }
    
    #msg.error { 
      margin-top: 14px; 
      color: #8c1d1d; 
      background-color: var(--accent-pink); 
      border: 2.5px solid var(--pencil-color);
      padding: 10px;
      border-radius: 16px;
      box-shadow: 3px 3px 0px var(--shadow-color);
    }

    .filter-box {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .filter-box input, .filter-box select {
      padding: 8px 10px;
      font-size: 13px;
      border-radius: 12px;
    }

    .log-item {
      background: var(--log-bg);
      border: 2.5px solid var(--pencil-color);
      box-shadow: 4px 4px 0px var(--shadow-color);
      border-radius: 20px 8px 18px 10px;
      padding: 12px 14px;
      margin-bottom: 14px;
      position: relative;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding-right: 24px;
    }

    .log-date {
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 700;
    }

    .log-meal {
      background: var(--accent-yellow);
      color: #2c2825;
      border: 2px solid var(--pencil-color);
      font-size: 12px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 10px;
    }

    .log-food {
      font-size: 15px;
      font-weight: bold;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .log-meta {
      font-size: 12px;
      color: var(--text-sub);
    }

    .btn-delete {
      position: absolute;
      top: 10px;
      right: 10px;
      background: transparent;
      border: none;
      box-shadow: none;
      width: auto;
      padding: 2px;
      margin: 0;
      font-size: 16px;
      cursor: pointer;
      opacity: 0.7;
    }

    .no-logs {
      text-align: center;
      color: var(--text-sub);
      font-size: 14px;
      padding: 20px 0;
    }

    /* 📸 截圖模式專用樣式 */
    .screenshot-card {
      background: var(--card-bg);
      border: 3.5px solid var(--pencil-color);
      border-radius: 25px;
      padding: 20px;
      box-shadow: 6px 6px 0px var(--shadow-color);
    }

    .shot-header {
      text-align: center;
      border-bottom: 2.5px dashed var(--pencil-color);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .shot-title {
      font-family: 'Fredoka', cursive, sans-serif;
      font-size: 20px;
      font-weight: bold;
      margin: 0 0 6px 0;
      color: var(--text-main);
    }

    .shot-sub {
      font-size: 13px;
      font-weight: bold;
      color: var(--text-sub);
    }

    .shot-item {
      background: var(--input-bg);
      border: 2px solid var(--pencil-color);
      border-radius: 14px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }

    .shot-meal-tag {
      display: inline-block;
      background: var(--accent-pink);
      color: #2c2825;
      font-size: 12px;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 8px;
      border: 1.5px solid var(--pencil-color);
      margin-bottom: 4px;
    }

    .shot-food-name {
      font-size: 15px;
      font-weight: bold;
      color: var(--text-main);
    }

    .shot-details {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .shot-footer-hint {
      text-align: center;
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 16px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<!-- SVG 粗糙手繪線條濾鏡 -->
<svg class="svg-filters">
  <defs>
    <filter id="hand-drawn-stroke">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="1" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
</svg>

<div class="card" id="mainCard">
  <div class="top-controls">
    <button class="control-btn" id="shotModeBtn" onclick="toggleScreenshotMode()">📸 截圖</button>
    <button class="control-btn" id="langBtn" onclick="toggleLanguage()">🌐 EN</button>
    <button class="control-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>

  <!-- 標準應用程式介面 -->
  <div id="normalView">
    <div class="header">
      <h2 id="appTitle">👦 小王子成長紀錄 🚗</h2>
    </div>

    <div class="hw-banner">
      <div>
        <div class="hw-title" id="hwTitle">📏 最新身材紀錄</div>
        <div class="hw-values" id="hwValues">-- cm | -- kg</div>
      </div>
      <div class="hw-date" id="hwDate">📅 --</div>
    </div>

    <div class="dashboard">
      <div class="stat-box-milk">
        <div class="stat-label" id="statMilkLabel">🍼 今日總奶量</div>
        <div class="stat-value" id="statMilk">0 ml</div>
      </div>
      <div class="stat-box-meal">
        <div class="stat-label" id="statCountLabel">🥣 今日用餐數</div>
        <div class="stat-value" id="statCount">0 次</div>
      </div>
    </div>

    <div class="tab-group">
      <button class="tab-btn active" id="tabAddBtn" onclick="switchTab('add')">📝 新增紀錄</button>
      <button class="tab-btn" id="tabListBtn" onclick="switchTab('list')">📋 過往紀錄</button>
    </div>

    <div id="sectionAdd">
      <form id="foodForm">
        <div class="form-group">
          <label for="date" id="labelDate">📅 日期</label>
          <input type="date" id="date" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="height" id="labelHeight">📏 身高 (cm)</label>
            <select id="height">
              <option value="">-- 請選擇身高 --</option>
            </select>
          </div>
          <div class="form-group">
            <label for="weight" id="labelWeight">⚖️ 體重 (kg)</label>
            <select id="weight">
              <option value="">-- 請選擇體重 --</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="meal" id="labelMeal">⏰ 餐別 (有飲食時選擇)</label>
          <select id="meal"></select>
        </div>

        <div class="form-group">
          <label for="food" id="labelFood">🥦 食物 / 奶量內容 (選填)</label>
          <input type="text" id="food" list="foodList" placeholder="例：牛肉番茄粥 1碗 / 210ml" autocomplete="off">
          <datalist id="foodList"></datalist>

          <div class="quick-title" id="quickMilkTitle">🍼 飲奶快捷鍵：</div>
          <div class="chips-container">
            <div class="chip chip-c1" onclick="setQuickMilk('120ml')">120ml</div>
            <div class="chip chip-c2" onclick="setQuickMilk('150ml')">150ml</div>
            <div class="chip chip-c3" onclick="setQuickMilk('180ml')">180ml</div>
            <div class="chip chip-c4" onclick="setQuickMilk('210ml')">210ml</div>
            <div class="chip chip-c5" onclick="setQuickMilk('240ml')">240ml</div>
          </div>

          <div id="quickSection" style="display:none;">
            <div class="quick-title" id="quickFoodTitle">⚡ 常用食物快捷鍵：</div>
            <div id="quickChips" class="chips-container"></div>
          </div>
        </div>

        <div class="form-group">
          <label for="calories" id="labelCalories">📏 份量 / 飽肚情況 (選填)</label>
          <input type="text" id="calories" placeholder="例：食咗 8 成 / 180ml">
        </div>

        <div class="form-group">
          <label for="notes" id="labelNotes">📝 備註 (選填)</label>
          <textarea id="notes" rows="2" placeholder="例：精神好、便便正常..."></textarea>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">🚀 儲存紀錄 🚀</button>
      </form>
      <div id="msg"></div>
    </div>

    <!-- 過往紀錄頁面 -->
    <div id="sectionList" style="display:none;">
      <div class="view-toggle-group">
        <button class="view-btn active" id="viewListBtn" onclick="switchHistoryView('list')">📋 列表檢視</button>
        <button class="view-btn" id="viewChartBtn" onclick="switchHistoryView('chart')">📊 圖表統計</button>
      </div>

      <div id="historyListView">
        <div style="display: flex; gap: 8px; margin-bottom: 8px;">
          <button class="control-btn" style="flex: 1; justify-content: center;" onclick="setFilterDate(0)" id="filterTodayBtn">📅 今天</button>
          <button class="control-btn" style="flex: 1; justify-content: center;" onclick="setFilterDate(-1)" id="filterYesterdayBtn">📅 昨天</button>
        </div>
        <div class="filter-box">
          <input type="date" id="filterDate" onchange="loadPastLogs()">
          <select id="filterMeal" onchange="loadPastLogs()"></select>
        </div>

        <div id="logsContainer">
          <div class="no-logs" id="loadingLogsMsg">載入過往紀錄中...</div>
        </div>
      </div>

      <div id="historyChartView" style="display:none;">
        <div class="chart-card">
          <h3 class="chart-title" id="chartMilkTitle">🍼 每日飲奶量趨勢 (ml)</h3>
          <canvas id="milkChart"></canvas>
        </div>

        <div class="chart-card">
          <h3 class="chart-title" id="chartMealTitle">🥣 餐別飲食比例</h3>
          <canvas id="mealPieChart"></canvas>
        </div>

  let currentLang = localStorage.getItem('app_lang') || 'zh';

    applyTheme(currentTheme);

    initHWDropdowns();
    autoSelectMealByTime();
    loadConfigs();
    loadRecentFoods();
    loadStats();
    loadLatestHW();

  function initHWDropdowns() {
    const heightSelect = document.getElementById('height');
    const weightSelect = document.getElementById('weight');
    const t = i18n[currentLang];

    const currentHeight = heightSelect.value;
    const currentWeight = weightSelect.value;

    heightSelect.innerHTML = `<option value="">${t.defaultHeight}</option>`;
    for (let h = 60.0; h <= 130.0; h += 0.5) {
      const val = h.toFixed(1);
      const opt = document.createElement('option');
      opt.value = val;
      opt.innerText = val + " cm";
      heightSelect.appendChild(opt);
    }
    if (currentHeight) heightSelect.value = currentHeight;

    weightSelect.innerHTML = `<option value="">${t.defaultWeight}</option>`;
    for (let w = 5.0; w <= 30.0; w += 0.1) {
      const val = w.toFixed(1);
      const opt = document.createElement('option');
      opt.value = val;
      opt.innerText = val + " kg";
      weightSelect.appendChild(opt);
    }
    if (currentWeight) weightSelect.value = currentWeight;
  }

  function toggleTheme() {
    currentTheme = currentTheme === 'light' ? 'dark' : 'light';
    localStorage.setItem('app_theme', currentTheme);
    applyTheme(currentTheme);
    if (currentHistoryView === 'chart' && !isScreenshotMode) {
      renderCharts();
    }
  }

  function applyTheme(theme) {
    const themeBtn = document.getElementById('themeBtn');
    if (theme === 'dark') {
      document.body.classList.add('dark-mode');
      themeBtn.innerText = "☀️ Light";
    } else {
      document.body.classList.remove('dark-mode');
      themeBtn.innerText = "🌙 Dark";
    }
  }

  function toggleLanguage() {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    localStorage.setItem('app_lang', currentLang);
    applyLanguage(currentLang);
    initHWDropdowns();
    if (isScreenshotMode) {
      renderScreenshotCard();
    } else if (currentHistoryView === 'chart') {
      renderCharts();
    } else {
      loadPastLogs();
    }
  }

  function applyLanguage(lang) {
    const t = i18n[lang];
    document.getElementById('langBtn').innerText = lang === 'zh' ? "🌐 EN" : "🌐 中文";

    document.getElementById('appTitle').innerText = t.appTitle;
    document.getElementById('shotModeBtn').innerText = t.shotModeBtn;
    document.getElementById('exitShotBtn').innerText = t.exitShotBtn;
    document.getElementById('shotCardTitle').innerText = t.shotCardTitle;
    document.getElementById('shotFooterHint').innerText = t.shotFooterHint;

    document.getElementById('hwTitle').innerText = t.hwTitle;
    document.getElementById('statMilkLabel').innerText = t.statMilkLabel;
    document.getElementById('statCountLabel').innerText = t.statCountLabel;
    document.getElementById('tabAddBtn').innerText = t.tabAddBtn;
    document.getElementById('tabListBtn').innerText = t.tabListBtn;

    document.getElementById('viewListBtn').innerText = t.viewListBtn;
    document.getElementById('viewChartBtn').innerText = t.viewChartBtn;
    document.getElementById('chartMilkTitle').innerText = t.chartMilkTitle;
    document.getElementById('chartMealTitle').innerText = t.chartMealTitle;
    document.getElementById('chartGrowthTitle').innerText = t.chartGrowthTitle;

    document.getElementById('labelDate').innerText = t.labelDate;
    document.getElementById('labelMeal').innerText = t.labelMeal;
    document.getElementById('labelFood').innerText = t.labelFood;
    document.getElementById('food').placeholder = t.placeholderFood;

    document.getElementById('labelHeight').innerText = t.labelHeight;
    document.getElementById('labelWeight').innerText = t.labelWeight;

    document.getElementById('quickMilkTitle').innerText = t.quickMilkTitle;
    document.getElementById('quickFoodTitle').innerText = t.quickFoodTitle;

    document.getElementById('labelCalories').innerText = t.labelCalories;
    document.getElementById('calories').placeholder = t.placeholderCalories;

    document.getElementById('labelNotes').innerText = t.labelNotes;
    document.getElementById('notes').placeholder = t.placeholderNotes;

    document.getElementById('submitBtn').innerText = t.submitBtn;

    document.getElementById('filterTodayBtn').innerText = t.filterToday;
    document.getElementById('filterYesterdayBtn').innerText = t.filterYesterday;

    updateMealOptions();
  }

  function updateMealOptions() {
    const mealSelect = document.getElementById('meal');
    const filterMealSelect = document.getElementById('filterMeal');
    const selectedMealVal = mealSelect.value;
    const selectedFilterVal = filterMealSelect.value;

    const t = i18n[currentLang];

    mealSelect.innerHTML = '';
    t.meals.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.value;
      opt.innerText = m.text;
      mealSelect.appendChild(opt);
    });
    if (selectedMealVal) mealSelect.value = selectedMealVal;

    filterMealSelect.innerHTML = `<option value="全部">${t.allMeals}</option>`;
    t.meals.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.value;
      opt.innerText = m.text.split(' ')[1] || m.text;
      filterMealSelect.appendChild(opt);
    });
    if (selectedFilterVal) filterMealSelect.value = selectedFilterVal;
  }

  function loadConfigs() {
    const cachedConfig = localStorage.getItem('app_config');
    if (cachedConfig) {
      try {
        const data = JSON.parse(cachedConfig);
        applyConfigData(data);
      } catch (e) {
        localStorage.removeItem('app_config');
      }
    }

    fetch(GAS_URL + "?action=getConfigs")
      .then(res => res.json())
      .then(data => {
        if (data) {
          localStorage.setItem('app_config', JSON.stringify(data));
          applyConfigData(data);
        }
      })
      .catch(err => console.log('讀取設定檔失敗', err));
  }

  function applyConfigData(data) {
    if (data.title_text && currentLang === 'zh') document.getElementById('appTitle').innerText = data.title_text;
    if (data.success_msg) customMsgs.success_msg = data.success_msg;
    if (data.error_msg) customMsgs.error_msg = data.error_msg;
  }

  function autoSelectMealByTime() {
    const hour = new Date().getHours();
    const mealSelect = document.getElementById('meal');
    
    if (hour >= 6 && hour < 10) {
      mealSelect.value = "早餐";
    } else if (hour >= 10 && hour < 14) {
      mealSelect.value = "午餐";
    } else if (hour >= 14 && hour < 17) {
      mealSelect.value = "下午茶";
    } else if (hour >= 17 && hour < 21) {
      mealSelect.value = "晚餐";
    } else {
      mealSelect.value = "睡前奶/宵夜";
    }
  }

  function switchTab(tab) {
    const sectionAdd = document.getElementById('sectionAdd');
    const sectionList = document.getElementById('sectionList');
    const tabAddBtn = document.getElementById('tabAddBtn');
    const tabListBtn = document.getElementById('tabListBtn');

    if (tab === 'add') {
      sectionAdd.style.display = 'block';
      sectionList.style.display = 'none';
      tabAddBtn.classList.add('active');
      tabListBtn.classList.remove('active');
    } else {
      sectionAdd.style.display = 'none';
      sectionList.style.display = 'block';
      tabAddBtn.classList.remove('active');
      tabListBtn.classList.add('active');
      if (currentHistoryView === 'chart') {
        renderCharts();
      } else {
        setFilterDate(0);
      }
    }
  }

  function switchHistoryView(view) {
    currentHistoryView = view;
    const listView = document.getElementById('historyListView');
    const chartView = document.getElementById('historyChartView');
    const listBtn = document.getElementById('viewListBtn');
    const chartBtn = document.getElementById('viewChartBtn');

    if (view === 'chart') {
      listView.style.display = 'none';
      chartView.style.display = 'block';
      listBtn.classList.remove('active');
      chartBtn.classList.add('active');
      renderCharts();
    } else {
      listView.style.display = 'block';
      chartView.style.display = 'none';
      listBtn.classList.add('active');
      chartBtn.classList.remove('active');
      loadPastLogs();
    }

  /* 📸 開啟 / 關閉 截圖模式 */
  function toggleScreenshotMode() {
    isScreenshotMode = !isScreenshotMode;
    const normalView = document.getElementById('normalView');
    const screenshotView = document.getElementById('screenshotView');
    const shotModeBtn = document.getElementById('shotModeBtn');

    if (isScreenshotMode) {
      normalView.style.display = 'none';
      screenshotView.style.display = 'block';
      shotModeBtn.style.background = 'var(--accent-yellow)';
      renderScreenshotCard();
    } else {
      normalView.style.display = 'block';
      screenshotView.style.display = 'none';
      shotModeBtn.style.background = 'var(--card-bg)';
    }
  }

  /* 渲染截圖卡片資料 */
  function renderScreenshotCard() {
    const targetDate = document.getElementById('shotDate').value;
    const container = document.getElementById('shotListContainer');
    const t = i18n[currentLang];

    document.getElementById('shotDateText').innerText = `📅 ${targetDate}`;
    container.innerHTML = `<div class="no-logs">${t.searching}</div>`;

    fetch(GAS_URL + "?action=getLogs&date=" + encodeURIComponent(targetDate))
      .then(res => res.json())
      .then(logs => {
        let totalMilk = 0;
        let mealCount = 0;

        if (!logs || logs.length === 0) {
          container.innerHTML = `<div class="no-logs">${t.noLogsFound}</div>`;
          document.getElementById('shotStatsText').innerText = `🍼 ${t.statMilkLabel.replace('今日總奶量','奶量')}: 0ml | 🥣 ${t.statCountLabel.replace('今日用餐數','用餐')}: 0${t.unitTimes}`;
          return;
        }

        container.innerHTML = '';
        logs.forEach(log => {
          const milkVal = parseMilkAmount(log.food) || parseMilkAmount(log.calories);
          totalMilk += milkVal;
          if (log.food) mealCount++;

          const matchedMeal = t.meals.find(m => m.value === log.meal);
          const displayMeal = matchedMeal ? matchedMeal.text : log.meal;

          const item = document.createElement('div');
          item.className = 'shot-item';

          let details = [];
          if (log.calories) details.push(`${t.portionText}: ${log.calories}`);
          if (log.notes) details.push(`${t.notesText}: ${log.notes}`);

          item.innerHTML = `
            <div class="shot-meal-tag">${displayMeal}</div>
            <div class="shot-food-name">🥣 ${log.food || '--'}</div>
            ${details.length > 0 ? `<div class="shot-details">${details.join(' | ')}</div>` : ''}
          `;
          container.appendChild(item);
        });

        document.getElementById('shotStatsText').innerText = `🍼 總奶量: ${totalMilk}ml | 🥣 用餐數: ${mealCount}${t.unitTimes}`;
      })
      .catch(() => {
        container.innerHTML = `<div class="no-logs">${t.failLogs}</div>`;
      });
  }

  function parseMilkAmount(str) {
    if (!str) return 0;
    const match = str.match(/(\d+)\s*ml/i);
    return match ? parseInt(match[1], 10) : 0;
  }

  function renderCharts() {
    fetch(GAS_URL + "?action=getLogs")
      .then(res => res.json())
      .then(logs => {
        if (!logs || logs.length === 0) return;

        const isDark = currentTheme === 'dark';
        const textColor = isDark ? '#f3ece4' : '#2c2825';
        const gridColor = isDark ? 'rgba(255,255,255,0.1)' : 'rgba(0,0,0,0.1)';

        Chart.defaults.font.family = "'Short Stack', 'Fredoka', cursive, sans-serif";
        Chart.defaults.color = textColor;

        const milkByDate = {};
        const mealCounts = {};
        const growthLogs = [];

        const sortedLogs = [...logs].sort((a, b) => new Date(a.date) - new Date(b.date));

        sortedLogs.forEach(log => {
          const milkVal = parseMilkAmount(log.food) || parseMilkAmount(log.calories);
          if (!milkByDate[log.date]) milkByDate[log.date] = 0;
          milkByDate[log.date] += milkVal;

          const mealName = log.meal || '其他';
          mealCounts[mealName] = (mealCounts[mealName] || 0) + 1;

          if (log.height || log.weight) {
            growthLogs.push({
              date: log.date,
              height: log.height ? parseFloat(log.height) : null,
              weight: log.weight ? parseFloat(log.weight) : null
            });
          }
        });

        const dates = Object.keys(milkByDate);
        const milkValues = dates.map(d => milkByDate[d]);

        if (milkChartInstance) milkChartInstance.destroy();
        const ctxMilk = document.getElementById('milkChart').getContext('2d');
        milkChartInstance = new Chart(ctxMilk, {
          type: 'bar',
          data: {
            labels: dates,
            datasets: [{
              label: '奶量 (ml)',
              data: milkValues,
              backgroundColor: '#9bf6ff',
              borderColor: '#2c2825',
              borderWidth: 2,
              borderRadius: 8
            }]
          },
          options: {
            responsive: true,
            scales: {
              x: { grid: { color: gridColor }, ticks: { color: textColor } },
              y: { grid: { color: gridColor }, ticks: { color: textColor }, beginAtZero: true }
            }
          }
        });

        const mealLabels = Object.keys(mealCounts);
        const mealValues = Object.values(mealCounts);

        if (mealPieChartInstance) mealPieChartInstance.destroy();
        const ctxMeal = document.getElementById('mealPieChart').getContext('2d');
        mealPieChartInstance = new Chart(ctxMeal, {
          type: 'doughnut',
          data: {
            labels: mealLabels,
            datasets: [{
              data: mealValues,
              backgroundColor: ['#ff8b94', '#ffe66d', '#a8e6cf', '#9bf6ff', '#bdb2ff', '#ffc6ff'],
              borderColor: '#2c2825',
              borderWidth: 2.5
            }]
          },
          options: {
            responsive: true,
            plugins: {
              legend: { position: 'bottom', labels: { color: textColor } }
            }
          }
        });

        const gDates = growthLogs.map(g => g.date);
        const gHeights = growthLogs.map(g => g.height);
        const gWeights = growthLogs.map(g => g.weight);

        if (growthChartInstance) growthChartInstance.destroy();
        const ctxGrowth = document.getElementById('growthChart').getContext('2d');
        growthChartInstance = new Chart(ctxGrowth, {
          type: 'line',
          data: {
            labels: gDates.length > 0 ? gDates : ['無資料'],
            datasets: [
              {
                label: '身高 (cm)',
                data: gHeights.length > 0 ? gHeights : [0],
                borderColor: '#ff8b94',
                backgroundColor: '#ff8b94',
                borderWidth: 3,
                tension: 0.3,
                yAxisID: 'y'
              },
              {
                label: '體重 (kg)',
                data: gWeights.length > 0 ? gWeights : [0],
                borderColor: '#a8e6cf',
                backgroundColor: '#a8e6cf',
                borderWidth: 3,
                tension: 0.3,
                yAxisID: 'y1'
              }
            ]
          },
          options: {
            responsive: true,
            scales: {
              x: { grid: { color: gridColor }, ticks: { color: textColor } },
              y: {
                type: 'linear',
                display: true,
                position: 'left',
                title: { display: true, text: 'cm', color: textColor },
                grid: { color: gridColor },
                ticks: { color: textColor }
              },
              y1: {
                type: 'linear',
                display: true,
                position: 'right',
                title: { display: true, text: 'kg', color: textColor },
                grid: { drawOnChartArea: false },
                ticks: { color: textColor }
              }
            }
          }
        });
      })
      .catch(err => console.log('載入圖表數據失敗', err));
  }

  function setFilterDate(daysOffset) {
    const d = new Date();
    d.setDate(d.getDate() + daysOffset);
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    document.getElementById('filterDate').value = `${year}-${month}-${day}`;
    loadPastLogs();
  }

  function setQuickFood(text) {
    document.getElementById('food').value = text;
  }

  function setQuickMilk(amount) {
    const prefix = i18n[currentLang].formulaPrefix;
    document.getElementById('food').value = `${prefix} ${amount}`;
  }

  function loadStats() {
    fetch(GAS_URL + "?action=getStats")
      .then(res => res.json())
      .then(data => {
        document.getElementById('statMilk').innerText = (data.totalMilk || 0) + " ml";
        document.getElementById('statCount').innerText = (data.mealCount || 0) + i18n[currentLang].unitTimes;
      })
      .catch(err => console.log('載入統計失敗', err));
  }

  function loadLatestHW() {
    fetch(GAS_URL + "?action=getLatestHW")
      .then(res => res.json())
      .then(data => {
        if (data) {
          document.getElementById('hwValues').innerText = `${data.height} | ${data.weight}`;
          document.getElementById('hwDate').innerText = `📅 ${data.date}`;
        }
      })
      .catch(err => console.log('載入最新身高體重失敗', err));
  }

  function loadRecentFoods() {
    fetch(GAS_URL + "?action=getRecent")
      .then(res => res.json())
      .then(foods => {
        if (foods && foods.length > 0) {
          const datalist = document.getElementById('foodList');
          const chipsContainer = document.getElementById('quickChips');
          datalist.innerHTML = '';
          chipsContainer.innerHTML = '';

          foods.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item;
            datalist.appendChild(opt);

            const chip = document.createElement('div');
            chip.className = 'chip chip-item';
            chip.innerText = item;
            chip.onclick = function() { setQuickFood(item); };
            chipsContainer.appendChild(chip);
          });

          document.getElementById('quickSection').style.display = 'block';
        }
      })
      .catch(err => console.log('載入常用紀錄失敗', err));
  }

  function loadPastLogs() {
    const fDate = document.getElementById('filterDate').value;
    const fMeal = document.getElementById('filterMeal').value;
    const t = i18n[currentLang];

    let queryUrl = GAS_URL + "?action=getLogs";
    if (fDate) queryUrl += "&date=" + encodeURIComponent(fDate);
    if (fMeal) queryUrl += "&meal=" + encodeURIComponent(fMeal);

    const container = document.getElementById('logsContainer');
    container.innerHTML = `<div class="no-logs">${t.searching}</div>`;

    fetch(queryUrl)
      .then(res => res.json())
      .then(logs => {
        if (!logs || logs.length === 0) {
          container.innerHTML = `<div class="no-logs">${t.noLogsFound}</div>`;
          return;
        }

        container.innerHTML = '';
        logs.forEach(log => {
          const item = document.createElement('div');
          item.className = 'log-item';
          
          let metaParts = [];
          if (log.calories) metaParts.push(`${t.portionText}：${log.calories}`);
          if (log.height) metaParts.push(`📏 ${t.heightText}：${log.height} cm`);
          if (log.weight) metaParts.push(`⚖️ ${t.weightText}：${log.weight} kg`);
          if (log.notes) metaParts.push(`${t.notesText}：${log.notes}`);

          const metaText = metaParts.join(' | ');
          const matchedMeal = t.meals.find(m => m.value === log.meal);
          const displayMeal = matchedMeal ? matchedMeal.text : log.meal;

          const delBtn = document.createElement('button');
          delBtn.className = 'btn-delete';
          delBtn.title = 'Delete';
          delBtn.textContent = '🗑️';
          delBtn.onclick = () => deleteLog(log.rowIndex);
          item.appendChild(delBtn);

          const headerDiv = document.createElement('div');
          headerDiv.className = 'log-header';
          
          const dateSpan = document.createElement('span');
          dateSpan.className = 'log-date';
          dateSpan.textContent = `📅 ${log.date}`;
          
          const mealSpan = document.createElement('span');
          mealSpan.className = 'log-meal';
          mealSpan.textContent = displayMeal;
          
          headerDiv.appendChild(dateSpan);
          headerDiv.appendChild(mealSpan);
          item.appendChild(headerDiv);

          const foodDiv = document.createElement('div');
          foodDiv.className = 'log-food';
          foodDiv.textContent = `🥣 ${log.food}`;
          item.appendChild(foodDiv);

          if (metaText) {
            const metaDiv = document.createElement('div');
            metaDiv.className = 'log-meta';
            metaDiv.textContent = metaText;
            item.appendChild(metaDiv);
          }

          container.appendChild(item);
        });
      })
      .catch(() => {
        container.innerHTML = `<div class="no-logs">${t.failLogs}</div>`;
      });
  }

  function deleteLog(rowIndex) {
    const t = i18n[currentLang];
    if (!confirm(t.confirmDelete)) return;

    fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "delete", rowIndex: rowIndex })
    })
    .then(() => {
      alert(t.deleteSuccess);
      setTimeout(() => {
        if (currentHistoryView === 'chart') {
          renderCharts();
        } else {
          loadPastLogs();
        }
        loadStats();
      }, 800);
    })
    .catch(() => alert(t.deleteFail));
  }

  document.getElementById('foodForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');
    const t = i18n[currentLang];

    const foodVal = document.getElementById('food').value.trim();
    const heightVal = document.getElementById('height').value;
    const weightVal = document.getElementById('weight').value;

    if (!foodVal && !heightVal && !weightVal) {
      msg.className = 'error';
      msg.innerText = t.emptyNotice;
      return;
    }

    btn.disabled = true;
    btn.innerText = t.savingBtn;
    msg.className = '';
    msg.innerText = '';

    const payload = {
      action: "add",
      date: document.getElementById('date').value,
      meal: document.getElementById('meal').value,
      food: foodVal,
      height: heightVal,
      weight: weightVal,
      calories: document.getElementById('calories').value,
      notes: document.getElementById('notes').value
    };

    fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      btn.disabled = false;
      btn.innerText = t.submitBtn;
      msg.className = 'success';
      msg.innerText = customMsgs.success_msg; 

      document.getElementById('food').value = '';
      document.getElementById('height').value = '';
      document.getElementById('weight').value = '';
      document.getElementById('calories').value = '';
      document.getElementById('notes').value = '';

      setTimeout(() => {
        autoSelectMealByTime();
        loadRecentFoods();
        loadStats();
        loadLatestHW();
      }, 1000);
    })
    .catch(() => {
      btn.disabled = false;
      btn.innerText = t.submitBtn;
      msg.className = 'error';
      msg.innerText = customMsgs.error_msg; 
    });
  });
</script>

</body>
</html>
