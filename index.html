<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="寶寶成長紀錄">
  <meta name="theme-color" content="#FF7E5F">
  <title>Luka's 小王子飲食成長紀錄</title>
  
	<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/keliguru/track-food/refs/heads/main/food-icon.png">
	<meta property="og:type" content="website">
	<meta property="og:title" content="Luka's 小王子飲食成長紀錄">
	<meta property="og:description" content="Luka's 小王子飲食成長紀錄！">
	<meta property="og:image" content="https://raw.githubusercontent.com/keliguru/track-food/refs/heads/main/food-icon.png"> 
	<link rel="apple-touch-icon" href="https://raw.githubusercontent.com/keliguru/track-food/refs/heads/main/food-icon.png">

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #eef2ff 0%, #fef2f2 50%, #f0fdf4 100%);
      --card-bg: #f8fafc;
      --card-border: rgba(255, 255, 255, 0.9);
      --text-main: #2d3748;
      --text-sub: #64748b;
      --input-bg: #f1f5f9;
      --input-focus-bg: #ffffff;
      --label-color: #334155;
      
      --shadow-out: 10px 10px 20px #cbd5e1, -10px -10px 20px #ffffff;
      --shadow-out-sm: 5px 5px 12px #d1dbe8, -5px -5px 12px #ffffff;
      --shadow-in: inset 3px 3px 6px #cbd5e1, inset -3px -3px 6px #ffffff;
      --tab-bg: #e2e8f0;
      --tab-active-bg: #ffffff;
      --tab-active-color: #4f46e5;
      --log-bg: #ffffff;
      --log-shadow: 4px 4px 10px #e2e8f0, -4px -4px 10px #ffffff;
    }

    body.dark-mode {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #022c22 100%);
      --card-bg: #1e293b;
      --card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --input-bg: #0f172a;
      --input-focus-bg: #1e293b;
      --label-color: #cbd5e1;

      --shadow-out: 10px 10px 25px #090d16, -10px -10px 25px #2d3748;
      --shadow-out-sm: 5px 5px 12px #090d16, -5px -5px 12px #2d3748;
      --shadow-in: inset 3px 3px 6px #090d16, inset -3px -3px 6px #2d3748;
      --tab-bg: #0f172a;
      --tab-active-bg: #334155;
      --tab-active-color: #38bdf8;
      --log-bg: #0f172a;
      --log-shadow: 4px 4px 10px #090d16, -4px -4px 10px #1e293b;
    }

    * { 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body { 
      background: var(--bg-gradient);
      background-attachment: fixed;
      padding: 16px 12px; 
      color: var(--text-main); 
      margin: 0; 
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .card { 
      width: 100%;
      max-width: 440px; 
      background: var(--card-bg); 
      padding: 22px 18px; 
      border-radius: 28px; 
      box-shadow: var(--shadow-out);
      border: 2px solid var(--card-border);
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .top-controls {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-bottom: 8px;
    }

    .control-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      color: var(--text-main);
      box-shadow: var(--shadow-out-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .control-btn:active {
      box-shadow: var(--shadow-in);
      transform: translateY(1px);
    }

    .header {
      text-align: center;
      margin-bottom: 14px;
    }

    .header h2 { 
      margin: 0; 
      font-size: 21px; 
      background: linear-gradient(45deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
    }

    .hw-banner {
      background: linear-gradient(145deg, #eff6ff, #dbeafe);
      border: 1px solid #bfdbfe;
      box-shadow: 4px 4px 10px rgba(59, 130, 246, 0.15), -4px -4px 10px rgba(255, 255, 255, 0.5);
      border-radius: 18px;
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    body.dark-mode .hw-banner {
      background: linear-gradient(145deg, #1e3a8a, #1e40af);
      border-color: #3b82f6;
      box-shadow: 4px 4px 10px #090d16;
    }

    .hw-title {
      font-size: 12px;
      font-weight: 800;
      color: #1e40af;
    }
    body.dark-mode .hw-title { color: #bfdbfe; }

    .hw-date {
      font-size: 11px;
      color: #3b82f6;
      font-weight: bold;
    }
    body.dark-mode .hw-date { color: #93c5fd; }

    .hw-values {
      font-size: 14px;
      font-weight: 800;
      color: #1d4ed8;
      margin-top: 2px;
    }
    body.dark-mode .hw-values { color: #60a5fa; }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-box-milk {
      background: linear-gradient(145deg, #fffbeb, #fef3c7);
      border: 1px solid #fde68a;
      box-shadow: 4px 4px 10px rgba(217, 119, 6, 0.15), -4px -4px 10px rgba(255, 255, 255, 0.5);
      border-radius: 20px;
      padding: 12px 10px;
      text-align: center;
    }

    body.dark-mode .stat-box-milk {
      background: linear-gradient(145deg, #451a03, #78350f);
      border-color: #92400e;
      box-shadow: 4px 4px 10px #090d16;
    }

    .stat-box-milk .stat-label { color: #b45309; }
    body.dark-mode .stat-box-milk .stat-label { color: #fde68a; }
    .stat-box-milk .stat-value { color: #d97706; }
    body.dark-mode .stat-box-milk .stat-value { color: #fef08a; text-shadow: none; }

    .stat-box-meal {
      background: linear-gradient(145deg, #ecfdf5, #d1fae5);
      border: 1px solid #a7f3d0;
      box-shadow: 4px 4px 10px rgba(16, 185, 129, 0.15), -4px -4px 10px rgba(255, 255, 255, 0.5);
      border-radius: 20px;
      padding: 12px 10px;
      text-align: center;
    }

    body.dark-mode .stat-box-meal {
      background: linear-gradient(145deg, #064e3b, #047857);
      border-color: #059669;
      box-shadow: 4px 4px 10px #090d16;
    }

    .stat-box-meal .stat-label { color: #047857; }
    body.dark-mode .stat-box-meal .stat-label { color: #a7f3d0; }
    .stat-box-meal .stat-value { color: #059669; }
    body.dark-mode .stat-box-meal .stat-value { color: #6ee7b7; text-shadow: none; }

    .stat-label {
      font-size: 12px;
      font-weight: 700;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 800;
      margin-top: 2px;
      text-shadow: 1px 1px 0px #fff;
    }

    .tab-group {
      display: flex;
      background: var(--tab-bg);
      box-shadow: var(--shadow-in);
      border-radius: 18px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-weight: 700;
      font-size: 14px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--tab-active-bg);
      color: var(--tab-active-color);
      box-shadow: 3px 3px 8px rgba(0,0,0,0.15), -2px -2px 6px rgba(255,255,255,0.1);
    }

    .form-group { 
      margin-bottom: 16px; 
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group {
      flex: 1;
    }

    label { 
      display: block; 
      margin-bottom: 6px; 
      font-weight: 700; 
      font-size: 13px; 
      color: var(--label-color); 
    }

    input, select, textarea { 
      width: 100%; 
      padding: 12px 14px; 
      border: 1px solid var(--card-border); 
      border-radius: 16px; 
      font-size: 15px; 
      background: var(--input-bg);
      box-shadow: var(--shadow-in);
      color: var(--text-main);
      outline: none; 
      transition: all 0.2s ease;
      -webkit-appearance: none;
    }

    input:focus, select:focus, textarea:focus { 
      border-color: #6366f1; 
      background: var(--input-focus-bg);
    }

    .quick-title { 
      font-size: 12px; 
      color: var(--text-sub); 
      margin-top: 12px; 
      margin-bottom: 8px; 
      font-weight: 700;
    }

    .chips-container { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 8px; 
    }

    .chip { 
      padding: 8px 14px; 
      border-radius: 16px; 
      font-size: 13px; 
      font-weight: 800;
      cursor: pointer; 
      user-select: none;
      transition: all 0.15s ease;
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 3px 3px 8px rgba(0,0,0,0.1), -3px -3px 8px rgba(255,255,255,0.1);
    }

    .chip:active { 
      box-shadow: var(--shadow-in);
      transform: translateY(2px);
    }

    .chip-c1 { background: #ffe4e6; color: #e11d48; border-color: #fecdd3; } 
    .chip-c2 { background: #ffedd5; color: #ea580c; border-color: #fed7aa; } 
    .chip-c3 { background: #fef9c3; color: #ca8a04; border-color: #fef08a; } 
    .chip-c4 { background: #dcfce7; color: #16a34a; border-color: #bbf7d0; } 
    .chip-c5 { background: #e0e7ff; color: #4f46e5; border-color: #c7d2fe; } 

    body.dark-mode .chip-c1 { background: #881337; color: #fecdd3; }
    body.dark-mode .chip-c2 { background: #7c2d12; color: #fed7aa; }
    body.dark-mode .chip-c3 { background: #713f12; color: #fef08a; }
    body.dark-mode .chip-c4 { background: #14532d; color: #bbf7d0; }
    body.dark-mode .chip-c5 { background: #312e81; color: #c7d2fe; }

    .chip-item { background: #f0f9ff; color: #0284c7; border-color: #bae6fd; } 
    body.dark-mode .chip-item { background: #0c4a6e; color: #bae6fd; border-color: #0369a1; }

    .submit-btn { 
      width: 100%; 
      padding: 16px; 
      background: linear-gradient(145deg, #ff7e5f, #feb47b); 
      color: white; 
      border: none; 
      border-radius: 20px; 
      font-size: 17px; 
      font-weight: bold; 
      cursor: pointer; 
      margin-top: 12px; 
      box-shadow: 0 6px 0 #d9532f, 0 10px 15px rgba(255, 126, 95, 0.4);
      transition: all 0.1s ease;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }

    .submit-btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #d9532f, 0 4px 8px rgba(255, 126, 95, 0.3);
    }

    .submit-btn:disabled { 
      background: #cbd5e1; 
      box-shadow: none;
      transform: none;
    }

    #msg { 
      text-align: center; 
      font-weight: bold; 
      font-size: 13px; 
    }

    #msg:empty {
      display: none;
    }

    #msg.success { 
      margin-top: 14px; 
      color: #15803d; 
      background-color: #dcfce7; 
      padding: 10px;
      border-radius: 14px;
      box-shadow: var(--shadow-in);
    }
    
    #msg.error { 
      margin-top: 14px; 
      color: #b91c1c; 
      background-color: #fee2e2; 
      padding: 10px;
      border-radius: 14px;
      box-shadow: var(--shadow-in);
    }

    body.dark-mode .success { color: #86efac; background-color: #14532d; }
    body.dark-mode .error { color: #fca5a5; background-color: #7f1d1d; }

    .filter-box {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .filter-box input, .filter-box select {
      padding: 8px 10px;
      font-size: 12px;
      border-radius: 12px;
    }

    .log-item {
      background: var(--log-bg);
      box-shadow: var(--log-shadow);
      border-radius: 18px;
      padding: 12px 14px;
      margin-bottom: 12px;
      position: relative;
      border-left: 5px solid #6366f1;
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding-right: 24px;
    }

    .log-date {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 700;
    }

    .log-meal {
      background: #e0e7ff;
      color: #4338ca;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 10px;
    }

    body.dark-mode .log-meal {
      background: #312e81;
      color: #c7d2fe;
    }

    .log-food {
      font-size: 14px;
      font-weight: bold;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .log-meta {
      font-size: 11px;
      color: var(--text-sub);
    }

    .btn-delete {
      position: absolute;
      top: 10px;
      right: 10px;
      background: transparent;
      border: none;
      box-shadow: none;
      width: auto;
      padding: 2px;
      margin: 0;
      font-size: 14px;
      cursor: pointer;
      opacity: 0.6;
    }

    .no-logs {
      text-align: center;
      color: var(--text-sub);
      font-size: 13px;
      padding: 20px 0;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="top-controls">
    <button class="control-btn" id="langBtn" onclick="toggleLanguage()">🌐 EN</button>
    <button class="control-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>

  <div class="header">
    <h2 id="appTitle">👦 小王子成長紀錄 🚗</h2>
  </div>

  <div class="hw-banner">
    <div>
      <div class="hw-title" id="hwTitle">📏 最新身材紀錄</div>
      <div class="hw-values" id="hwValues">-- cm | -- kg</div>
    </div>
    <div class="hw-date" id="hwDate">📅 --</div>
  </div>

  <div class="dashboard">
    <div class="stat-box-milk">
      <div class="stat-label" id="statMilkLabel">🍼 今日總奶量</div>
      <div class="stat-value" id="statMilk">0 ml</div>
    </div>
    <div class="stat-box-meal">
      <div class="stat-label" id="statCountLabel">🥣 今日用餐數</div>
      <div class="stat-value" id="statCount">0 次</div>
    </div>
  </div>

  <div class="tab-group">
    <button class="tab-btn active" id="tabAddBtn" onclick="switchTab('add')">📝 新增紀錄</button>
    <button class="tab-btn" id="tabListBtn" onclick="switchTab('list')">📋 過往紀錄</button>
  </div>

  <div id="sectionAdd">
    <form id="foodForm">
      <div class="form-group">
        <label for="date" id="labelDate">📅 日期</label>
        <input type="date" id="date" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="height" id="labelHeight">📏 身高 (cm)</label>
          <input type="number" step="0.1" min="30" max="150" id="height" placeholder="例：90">
        </div>
        <div class="form-group">
          <label for="weight" id="labelWeight">⚖️ 體重 (kg)</label>
          <input type="number" step="0.01" min="1" max="40" id="weight" placeholder="例：12">
        </div>
      </div>

      <div class="form-group">
        <label for="meal" id="labelMeal">⏰ 餐別 (有飲食時選擇)</label>
        <select id="meal"></select>
      </div>

      <div class="form-group">
        <label for="food" id="labelFood">🥦 食物 / 奶量內容 (選填)</label>
        <input type="text" id="food" list="foodList" placeholder="例：牛肉番茄粥 1碗 / 210ml" autocomplete="off">
        <datalist id="foodList"></datalist>

        <div class="quick-title" id="quickMilkTitle">🍼 飲奶快捷鍵：</div>
        <div class="chips-container">
          <div class="chip chip-c1" onclick="setQuickMilk('120ml')">120ml</div>
          <div class="chip chip-c2" onclick="setQuickMilk('150ml')">150ml</div>
          <div class="chip chip-c3" onclick="setQuickMilk('180ml')">180ml</div>
          <div class="chip chip-c4" onclick="setQuickMilk('210ml')">210ml</div>
          <div class="chip chip-c5" onclick="setQuickMilk('240ml')">240ml</div>
        </div>

        <div id="quickSection" style="display:none;">
          <div class="quick-title" id="quickFoodTitle">⚡ 常用食物快捷鍵：</div>
          <div id="quickChips" class="chips-container"></div>
        </div>
      </div>

      <div class="form-group">
        <label for="calories" id="labelCalories">📏 份量 / 飽肚情況 (選填)</label>
        <input type="text" id="calories" placeholder="例：食咗 8 成 / 180ml">
      </div>

      <div class="form-group">
        <label for="notes" id="labelNotes">📝 備註 (選填)</label>
        <textarea id="notes" rows="2" placeholder="例：精神好、便便正常..."></textarea>
      </div>

      <button type="submit" id="submitBtn" class="submit-btn">🚀 儲存紀錄 🚀</button>
    </form>
    <div id="msg"></div>
  </div>

  <div id="sectionList" style="display:none;">
    <div class="filter-box">
      <input type="date" id="filterDate" onchange="loadPastLogs()">
      <select id="filterMeal" onchange="loadPastLogs()"></select>
    </div>

    <div id="logsContainer">
      <div class="no-logs" id="loadingLogsMsg">載入過往紀錄中...</div>
    </div>
  </div>
</div>

        { value: "配方奶", text: "🍼 配方奶" },
        { value: "早餐", text: "🥣 早餐" },
        { value: "午餐", text: "🍜 午餐 (副食品/正餐)" },
        { value: "下午茶", text: "🍎 下午茶 / 水果小食" },
        { value: "晚餐", text: "🍲 晚餐 (副食品/正餐)" },
        { value: "睡前奶/宵夜", text: "🌙 睡前奶 / 宵夜" }
      ]
    },
    en: {
      appTitle: "👦 Little Prince Growth Tracker 🚗",
      hwTitle: "📏 Latest Growth Stats",
      statMilkLabel: "🍼 Today's Milk",
      statCountLabel: "🥣 Meals Today",
      tabAddBtn: "📝 Add Record",
      tabListBtn: "📋 History",
      labelDate: "📅 Date",
      labelMeal: "⏰ Meal Time",
      labelFood: "🥦 Food / Milk Intake (Optional)",
      placeholderFood: "e.g. Beef Tomato Porridge 1 bowl / 210ml",
      quickMilkTitle: "🍼 Milk Quick Buttons:",
      quickFoodTitle: "⚡ Frequent Food Shortcuts:",
      labelHeight: "📏 Height (cm)",
      placeholderHeight: "e.g. 68.5",
      labelWeight: "⚖️ Weight (kg)",
      placeholderWeight: "e.g. 7.25",
      labelCalories: "📏 Portion / Appetite (Optional)",
      placeholderCalories: "e.g. Ate 80% / 180ml",
      labelNotes: "📝 Notes (Optional)",
      placeholderNotes: "e.g. Good mood, normal stool...",
      submitBtn: "🚀 Save Log 🚀",
      savingBtn: "Saving...",
      allMeals: "All Meals",
      loadingLogs: "Loading history logs...",
      searching: "Searching...",
      noLogsFound: "No matching records found",
      failLogs: "Failed to load logs",
      confirmDelete: "Are you sure you want to delete this record?",
      deleteSuccess: "Record deleted!",
      deleteFail: "Failed to delete, please try again!",
      emptyNotice: "⚠️ Please enter at least 'Food' or 'Height/Weight'!",
      invalidHeight: "⚠️ Invalid height value, please check!",
      invalidWeight: "⚠️ Invalid weight value, please check!",
      unitTimes: " meals",
      formulaPrefix: "Formula Milk",
      portionText: "Portion",
      notesText: "Notes",
      heightText: "Height",
      weightText: "Weight",
      success_msg: "🎉 Saved successfully!",
      error_msg: "❌ Failed to send, please try again!",
      meals: [
        { value: "配方奶", text: "🍼 Formula Milk" },
        { value: "早餐", text: "🥣 Breakfast" },
        { value: "午餐", text: "🍜 Lunch (Solids/Meal)" },
        { value: "下午茶", text: "🍎 Tea Time / Fruit" },
        { value: "晚餐", text: "🍲 Dinner (Solids/Meal)" },
        { value: "睡前奶/宵夜", text: "🌙 Bedtime Milk / Night" }
      ]
    }
  };

  let currentLang = localStorage.getItem('app_lang') || 'zh';
  let currentTheme = localStorage.getItem('app_theme') || 'light';

  let customMsgs = {
    success_msg: i18n[currentLang].success_msg,
    error_msg: i18n[currentLang].error_msg
  };

  document.getElementById('date').valueAsDate = new Date();

  window.onload = function() {
    applyTheme(currentTheme);
    applyLanguage(currentLang);
    autoSelectMealByTime();
    loadConfigs();
    loadRecentFoods();
    loadStats();
    loadLatestHW();
  };

  function toggleTheme() {
    currentTheme = currentTheme === 'light' ? 'dark' : 'light';
    localStorage.setItem('app_theme', currentTheme);
    applyTheme(currentTheme);
  }

  function applyTheme(theme) {
    const themeBtn = document.getElementById('themeBtn');
    if (theme === 'dark') {
      document.body.classList.add('dark-mode');
      themeBtn.innerText = "☀️ Light";
    } else {
      document.body.classList.remove('dark-mode');
      themeBtn.innerText = "🌙 Dark";
    }
  }

  function toggleLanguage() {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    localStorage.setItem('app_lang', currentLang);
    applyLanguage(currentLang);
    loadPastLogs();
  }

  function applyLanguage(lang) {
    const t = i18n[lang];
    document.getElementById('langBtn').innerText = lang === 'zh' ? "🌐 EN" : "🌐 中文";

    document.getElementById('appTitle').innerText = t.appTitle;
    document.getElementById('hwTitle').innerText = t.hwTitle;
    document.getElementById('statMilkLabel').innerText = t.statMilkLabel;
    document.getElementById('statCountLabel').innerText = t.statCountLabel;
    document.getElementById('tabAddBtn').innerText = t.tabAddBtn;
    document.getElementById('tabListBtn').innerText = t.tabListBtn;

    document.getElementById('labelDate').innerText = t.labelDate;
    document.getElementById('labelMeal').innerText = t.labelMeal;
    document.getElementById('labelFood').innerText = t.labelFood;
    document.getElementById('food').placeholder = t.placeholderFood;

    document.getElementById('labelHeight').innerText = t.labelHeight;
    document.getElementById('height').placeholder = t.placeholderHeight;
    document.getElementById('labelWeight').innerText = t.labelWeight;
    document.getElementById('weight').placeholder = t.placeholderWeight;

    document.getElementById('quickMilkTitle').innerText = t.quickMilkTitle;
    document.getElementById('quickFoodTitle').innerText = t.quickFoodTitle;

    document.getElementById('labelCalories').innerText = t.labelCalories;
    document.getElementById('calories').placeholder = t.placeholderCalories;

    document.getElementById('labelNotes').innerText = t.labelNotes;
    document.getElementById('notes').placeholder = t.placeholderNotes;

    document.getElementById('submitBtn').innerText = t.submitBtn;

    updateMealOptions();
  }

  function updateMealOptions() {
    const mealSelect = document.getElementById('meal');
    const filterMealSelect = document.getElementById('filterMeal');
    const selectedMealVal = mealSelect.value;
    const selectedFilterVal = filterMealSelect.value;

    const t = i18n[currentLang];

    mealSelect.innerHTML = '';
    t.meals.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.value;
      opt.innerText = m.text;
      mealSelect.appendChild(opt);
    });
    if (selectedMealVal) mealSelect.value = selectedMealVal;

    filterMealSelect.innerHTML = `<option value="全部">${t.allMeals}</option>`;
    t.meals.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.value;
      opt.innerText = m.text.split(' ')[1] || m.text;
      filterMealSelect.appendChild(opt);
    });
    if (selectedFilterVal) filterMealSelect.value = selectedFilterVal;
  }

  // 優化：加入 localStorage 快取設定檔，減少不必要的重複請求
  function loadConfigs() {
    const cachedConfig = localStorage.getItem('app_config');
    if (cachedConfig) {
      try {
        const data = JSON.parse(cachedConfig);
        applyConfigData(data);
      } catch (e) {
        localStorage.removeItem('app_config');
      }
    }

    fetch(GAS_URL + "?action=getConfigs")
      .then(res => res.json())
      .then(data => {
        if (data) {
          localStorage.setItem('app_config', JSON.stringify(data));
          applyConfigData(data);
        }
      })
      .catch(err => console.log('讀取設定檔失敗', err));
  }

  function applyConfigData(data) {
    if (data.title_text && currentLang === 'zh') document.getElementById('appTitle').innerText = data.title_text;
    if (data.success_msg) customMsgs.success_msg = data.success_msg;
    if (data.error_msg) customMsgs.error_msg = data.error_msg;
  }

  function autoSelectMealByTime() {
    const hour = new Date().getHours();
    const mealSelect = document.getElementById('meal');
    
    if (hour >= 6 && hour < 10) {
      mealSelect.value = "早餐";
    } else if (hour >= 10 && hour < 14) {
      mealSelect.value = "午餐";
    } else if (hour >= 14 && hour < 17) {
      mealSelect.value = "下午茶";
    } else if (hour >= 17 && hour < 21) {
      mealSelect.value = "晚餐";
    } else {
      mealSelect.value = "睡前奶/宵夜";
    }
  }

  function switchTab(tab) {
    const sectionAdd = document.getElementById('sectionAdd');
    const sectionList = document.getElementById('sectionList');
    const tabAddBtn = document.getElementById('tabAddBtn');
    const tabListBtn = document.getElementById('tabListBtn');

    if (tab === 'add') {
      sectionAdd.style.display = 'block';
      sectionList.style.display = 'none';
      tabAddBtn.classList.add('active');
      tabListBtn.classList.remove('active');
    } else {
      sectionAdd.style.display = 'none';
      sectionList.style.display = 'block';
      tabAddBtn.classList.remove('active');
      tabListBtn.classList.add('active');
      loadPastLogs();
    }
  }

  function setQuickFood(text) {
    document.getElementById('food').value = text;
  }

  function setQuickMilk(amount) {
    const prefix = i18n[currentLang].formulaPrefix;
    document.getElementById('food').value = `${prefix} ${amount}`;
  }

  function loadStats() {
    fetch(GAS_URL + "?action=getStats")
      .then(res => res.json())
      .then(data => {
        document.getElementById('statMilk').innerText = (data.totalMilk || 0) + " ml";
        document.getElementById('statCount').innerText = (data.mealCount || 0) + i18n[currentLang].unitTimes;
      })
      .catch(err => console.log('載入統計失敗', err));
  }

  function loadLatestHW() {
    fetch(GAS_URL + "?action=getLatestHW")
      .then(res => res.json())
      .then(data => {
        if (data) {
          document.getElementById('hwValues').innerText = `${data.height} | ${data.weight}`;
          document.getElementById('hwDate').innerText = `📅 ${data.date}`;
        }
      })
      .catch(err => console.log('載入最新身高體重失敗', err));
  }

  function loadRecentFoods() {
    fetch(GAS_URL + "?action=getRecent")
      .then(res => res.json())
      .then(foods => {
        if (foods && foods.length > 0) {
          const datalist = document.getElementById('foodList');
          const chipsContainer = document.getElementById('quickChips');
          datalist.innerHTML = '';
          chipsContainer.innerHTML = '';

          foods.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item;
            datalist.appendChild(opt);

            const chip = document.createElement('div');
            chip.className = 'chip chip-item';
            chip.innerText = item;
            chip.onclick = function() { setQuickFood(item); };
            chipsContainer.appendChild(chip);
          });

          document.getElementById('quickSection').style.display = 'block';
        }
      })
      .catch(err => console.log('載入常用紀錄失敗', err));
  }

  // 優化：使用 DOM 節點建立（textContent）取代 innerHTML，防止 XSS 攻擊
  function loadPastLogs() {
    const fDate = document.getElementById('filterDate').value;
    const fMeal = document.getElementById('filterMeal').value;
    const t = i18n[currentLang];

    let queryUrl = GAS_URL + "?action=getLogs";
    if (fDate) queryUrl += "&date=" + encodeURIComponent(fDate);
    if (fMeal) queryUrl += "&meal=" + encodeURIComponent(fMeal);

    const container = document.getElementById('logsContainer');
    container.innerHTML = `<div class="no-logs">${t.searching}</div>`;

    fetch(queryUrl)
      .then(res => res.json())
      .then(logs => {
        if (!logs || logs.length === 0) {
          container.innerHTML = `<div class="no-logs">${t.noLogsFound}</div>`;
          return;
        }

        container.innerHTML = '';
        logs.forEach(log => {
          const item = document.createElement('div');
          item.className = 'log-item';
          
          let metaParts = [];
          if (log.calories) metaParts.push(`${t.portionText}：${log.calories}`);
          if (log.height) metaParts.push(`📏 ${t.heightText}：${log.height} cm`);
          if (log.weight) metaParts.push(`⚖️ ${t.weightText}：${log.weight} kg`);
          if (log.notes) metaParts.push(`${t.notesText}：${log.notes}`);

          const metaText = metaParts.join(' | ');
          const matchedMeal = t.meals.find(m => m.value === log.meal);
          const displayMeal = matchedMeal ? matchedMeal.text : log.meal;

          // 建立刪除按鈕
          const delBtn = document.createElement('button');
          delBtn.className = 'btn-delete';
          delBtn.title = 'Delete';
          delBtn.textContent = '🗑️';
          delBtn.onclick = () => deleteLog(log.rowIndex);
          item.appendChild(delBtn);

          // 建立 Header
          const headerDiv = document.createElement('div');
          headerDiv.className = 'log-header';
          
          const dateSpan = document.createElement('span');
          dateSpan.className = 'log-date';
          dateSpan.textContent = `📅 ${log.date}`;
          
          const mealSpan = document.createElement('span');
          mealSpan.className = 'log-meal';
          mealSpan.textContent = displayMeal;
          
          headerDiv.appendChild(dateSpan);
          headerDiv.appendChild(mealSpan);
          item.appendChild(headerDiv);

          // 建立食物內容
          const foodDiv = document.createElement('div');
          foodDiv.className = 'log-food';
          foodDiv.textContent = `🥣 ${log.food}`;
          item.appendChild(foodDiv);

          // 建立 Meta 內容
          if (metaText) {
            const metaDiv = document.createElement('div');
            metaDiv.className = 'log-meta';
            metaDiv.textContent = metaText;
            item.appendChild(metaDiv);
          }

          container.appendChild(item);
        });
      })
      .catch(() => {
        container.innerHTML = `<div class="no-logs">${t.failLogs}</div>`;
      });
  }

  function deleteLog(rowIndex) {
    const t = i18n[currentLang];
    if (!confirm(t.confirmDelete)) return;

    fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "delete", rowIndex: rowIndex })
    })
    .then(() => {
      alert(t.deleteSuccess);
      setTimeout(() => {
        loadPastLogs();
        loadStats();
      }, 800);
    })
    .catch(() => alert(t.deleteFail));
  }

  document.getElementById('foodForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');
    const t = i18n[currentLang];

    const foodVal = document.getElementById('food').value.trim();
    const heightVal = document.getElementById('height').value.trim();
    const weightVal = document.getElementById('weight').value.trim();

    // 1. 空值防呆
    if (!foodVal && !heightVal && !weightVal) {
      msg.className = 'error';
      msg.innerText = t.emptyNotice;
      return;
    }

    // 2. 身高體重數值極值驗證防呆
    if (heightVal !== "") {
      const h = parseFloat(heightVal);
      if (isNaN(h) || h < 30 || h > 150) {
        msg.className = 'error';
        msg.innerText = t.invalidHeight;
        return;
      }
    }

    if (weightVal !== "") {
      const w = parseFloat(weightVal);
      if (isNaN(w) || w < 1 || w > 40) {
        msg.className = 'error';
        msg.innerText = t.invalidWeight;
        return;
      }
    }

    btn.disabled = true;
    btn.innerText = t.savingBtn;
    msg.className = '';
    msg.innerText = '';

    const payload = {
      action: "add",
      date: document.getElementById('date').value,
      meal: document.getElementById('meal').value,
      food: foodVal,
      height: heightVal,
      weight: weightVal,
      calories: document.getElementById('calories').value,
      notes: document.getElementById('notes').value
    };

    fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    })
    .then(() => {
      btn.disabled = false;
      btn.innerText = t.submitBtn;
      msg.className = 'success';
      msg.innerText = customMsgs.success_msg; 

      document.getElementById('food').value = '';
      document.getElementById('height').value = '';
      document.getElementById('weight').value = '';
      document.getElementById('calories').value = '';
      document.getElementById('notes').value = '';

      setTimeout(() => {
        autoSelectMealByTime();
        loadRecentFoods();
        loadStats();
        loadLatestHW();
      }, 1000);
    })
    .catch(() => {
      btn.disabled = false;
      btn.innerText = t.submitBtn;
      msg.className = 'error';
      msg.innerText = customMsgs.error_msg; 
    });
  });
</script>
