<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGO OCR AI</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --lego-red: #E3000B;
      --lego-yellow: #FFD500;
      --lego-blue: #006CB7;
      --lego-green: #00852B;
      --lego-black: #111111;
      --lego-bg: #F4F4F0;
    }

    * { box-sizing: border-box; font-family: 'Fredoka', cursive, system-ui, sans-serif; }

    body {
      margin: 0; padding: 16px;
      background-color: var(--lego-bg);
      background-image: radial-gradient(circle, rgba(0, 0, 0, 0.12) 20%, transparent 20%);
      background-size: 20px 20px;
      color: var(--lego-black);
      display: flex; justify-content: center;
    }

    .lego-container { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 16px; }

    .lego-card {
      background: #FFFFFF;
      border: 4px solid var(--lego-black);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 6px 6px 0px var(--lego-black);
    }

    .card-red { border-top: 12px solid var(--lego-red); }
    .card-yellow { border-top: 12px solid var(--lego-yellow); }

    h1 {
      margin: 0 0 8px 0; font-size: 1.5rem; text-align: center;
      color: var(--lego-yellow); text-shadow: 2px 2px 0px var(--lego-black);
      -webkit-text-stroke: 1px var(--lego-black);
    }

    label { display: block; font-weight: 700; margin-bottom: 6px; }

    input[type="password"], select {
      width: 100%; padding: 12px;
      border: 3px solid var(--lego-black); border-radius: 8px;
      font-size: 1rem; outline: none; background: #FAFAFA;
      box-shadow: inset 2px 2px 0px rgba(0,0,0,0.1);
    }

    select { cursor: pointer; font-weight: bold; background-color: #FFF; }

    .control-group { display: flex; gap: 10px; margin-bottom: 12px; }
    .control-group > div { flex: 1; }

    .markdown-body {
      width: 100%;
      min-height: 180px;
      max-height: 400px;
      overflow-y: auto;
      padding: 12px;
      border: 3px solid var(--lego-black);
      border-radius: 8px;
      background: #FAFAFA;
      box-shadow: inset 2px 2px 0px rgba(0,0,0,0.1);
      font-family: sans-serif;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .markdown-body table { width: 100%; border-collapse: collapse; margin: 12px 0; }
    .markdown-body th, .markdown-body td { border: 2px solid var(--lego-black); padding: 8px; text-align: left; }
    .markdown-body th { background-color: var(--lego-yellow); font-weight: bold; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { color: var(--lego-blue); margin-top: 12px; margin-bottom: 8px; text-shadow: none; -webkit-text-stroke: 0; }
    .markdown-body ul, .markdown-body ol { padding-left: 20px; }

    /* 拖曳與預覽區塊樣式 */
    .file-dropzone {
      border: 3px dashed var(--lego-black);
      background: #FFFDE7; border-radius: 8px;
      padding: 16px; text-align: center; cursor: pointer; font-weight: bold;
      transition: all 0.2s ease;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 120px;
    }

    .file-dropzone.dragover {
      background: #FFF9C4;
      border-color: var(--lego-blue);
      transform: scale(1.02);
    }

    .preview-img {
      max-width: 100%;
      max-height: 200px;
      border: 2px solid var(--lego-black);
      border-radius: 6px;
      margin-top: 8px;
      display: none;
      box-shadow: 3px 3px 0px var(--lego-black);
    }

    .lego-btn {
      padding: 10px 14px;
      border: 3px solid var(--lego-black); border-radius: 10px;
      font-size: 1rem; font-weight: 700; color: white;
      cursor: pointer; box-shadow: 0px 4px 0px var(--lego-black);
      transition: all 0.1s ease; display: inline-flex;
      align-items: center; justify-content: center; gap: 6px;
    }

    .btn-green { background-color: var(--lego-green); width: 100%; font-size: 1.1rem; padding: 14px; }
    .btn-yellow { background-color: var(--lego-yellow); color: var(--lego-black); width: 100%; }
    .btn-small-clear { background-color: #888; font-size: 0.8rem; padding: 4px 8px; border: 2px solid var(--lego-black); }

    .lego-btn:active { transform: translateY(2px); box-shadow: 0px 1px 0px var(--lego-black); }

    .collapse-header {
      background: #F0F0F0; border: 3px solid var(--lego-black);
      border-radius: 8px; padding: 10px; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      font-weight: bold; user-select: none;
    }

    .collapse-content { display: none; padding-top: 10px; }

    .progress-box {
      display: none; margin-top: 12px; border: 3px solid var(--lego-black);
      background: #DDD; border-radius: 8px; overflow: hidden; height: 24px;
    }

    .progress-bar { height: 100%; background: var(--lego-blue); width: 0%; transition: width 0.2s ease; }
    .status-text { font-weight: bold; margin-top: 6px; text-align: center; color: var(--lego-blue); font-size: 0.9rem; }

    .bottom-actions { display: flex; margin-top: 12px; }

    .history-section {
      margin-top: 12px;
      padding: 10px;
      background: #EBF3FA;
      border: 3px solid var(--lego-black);
      border-radius: 8px;
    }
  </style>
</head>
<body>

<div class="lego-container">

  <div class="lego-card card-red">
    <h1>LEGO OCR AI</h1>
    <p style="text-align: center; margin: 0; font-size: 0.85rem; font-weight: bold;">
      圖片轉文字 ➔ 多語言分析 ➔ 歷史紀錄管理
    </p>
  </div>

  <div class="lego-card card-yellow">
    
    <!-- API Key 設定 -->
    <div class="collapse-header" onclick="toggleSection('apiContent', 'arrowIcon')">
      <span id="keyHeaderTitle">🔑 DeepSeek API Key 設定</span>
      <span id="arrowIcon">▼</span>
    </div>

    <div id="apiContent" class="collapse-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <label style="margin: 0; font-size: 0.9rem;">輸入 Key：</label>
        <button class="lego-btn btn-small-clear" onclick="clearApiKey()">🧹 清除 Key</button>
      </div>
      <input type="password" id="apiKey" placeholder="貼上 DeepSeek API Key (sk-...)">
    </div>

    <hr style="border: 1px dashed var(--lego-black); margin: 16px 0;">

    <!-- 歷史紀錄選單區塊 -->
    <div class="history-section">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <label style="margin: 0;">📜 歷史紀錄選單：</label>
        <button class="lego-btn btn-small-clear" onclick="clearHistory()">清空歷史</button>
      </div>
      <select id="historySelect" onchange="loadHistoryItem(this.value)">
        <option value="">-- 請選擇過往紀錄 --</option>
      </select>
    </div>

    <hr style="border: 1px dashed var(--lego-black); margin: 16px 0;">

    <!-- 模式與語言選擇 -->
    <div class="control-group">
      <div>
        <label for="promptMode">處理模式：</label>
        <select id="promptMode">
          <option value="structure">🔍 數據結構化</option>
          <option value="summary">📊 重點摘要總結</option>
          <option value="proofread">📝 錯別字校對</option>
        </select>
      </div>
      <div>
        <label for="targetLang">🌐 輸出語言：</label>
        <select id="targetLang">
          <option value="Traditional Chinese" selected>繁體中文</option>
          <option value="Simplified Chinese">简体中文</option>
          <option value="English">English</option>
        </select>
      </div>
    </div>

    <label>選擇或拖曳圖片：</label>
    <!-- 支持拖曳與預覽的 Dropzone -->
    <div class="file-dropzone" id="dropzone" onclick="document.getElementById('imageInput').click()">
      <span id="dropzoneText">📷 點擊選擇相片，或把圖片拖曳至此處</span>
      <img id="imagePreview" class="preview-img" alt="圖片預覽">
      <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleFileSelect(this.files[0])">
    </div>
    <div id="fileName" style="font-size: 0.8rem; margin-top: 6px; text-align: center; font-weight: bold;"></div>

    <button class="lego-btn btn-green" onclick="startOneStepOCR()" style="margin-top: 14px;">
      🚀 一鍵轉化與分析
    </button>

    <div id="progressBox" class="progress-box">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <div id="statusText" class="status-text"></div>

    <label style="margin-top: 16px;">最終 AI 整理/總結結果：</label>
    <div id="aiOutput" class="markdown-body">解析結果會直接美化顯示於此...</div>

    <div class="bottom-actions">
      <button class="lego-btn btn-yellow" id="copyBtn" onclick="copyResult()">📋 複製內容</button>
    </div>

  </div>

</div>

<script>
  let rawMarkdownResult = '';
  let selectedFile = null;
  const HISTORY_KEY = 'lego_ocr_history';

  window.addEventListener('DOMContentLoaded', () => {
    // 載入 API Key
    const savedKey = localStorage.getItem('deepseek_api_key');
    if (savedKey) {
      document.getElementById('apiKey').value = savedKey;
      document.getElementById('keyHeaderTitle').innerText = '🔑 DeepSeek API Key (已設定)';
    }
    // 載入歷史紀錄清單
    renderHistoryDropdown();

    // 初始化拖曳事件監聽
    initDragAndDrop();
  });

  /* --- 拖曳與圖片預覽邏輯 --- */
  function initDragAndDrop() {
    const dropzone = document.getElementById('dropzone');

    ['dragenter', 'dragover'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropzone.addEventListener(eventName, (e) => {
        e.preventDefault();
        e.stopPropagation();
        dropzone.classList.remove('dragover');
      }, false);
    });

    dropzone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files && files.length > 0) {
        handleFileSelect(files[0]);
      }
    }, false);
  }

  function handleFileSelect(file) {
    if (!file || !file.type.startsWith('image/')) {
      alert('請選擇有效的圖片檔案！');
      return;
    }

    selectedFile = file;
    document.getElementById('fileName').innerText = "已選擇: " + file.name;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = document.getElementById('imagePreview');
      const text = document.getElementById('dropzoneText');
      img.src = e.target.result;
      img.style.display = 'block';
      text.innerText = '📷 點擊或拖曳圖片以更換';
    };
    reader.readAsDataURL(file);
  }

  function toggleSection(contentId, arrowId) {
    const content = document.getElementById(contentId);
    const arrow = document.getElementById(arrowId);
    if (content.style.display === 'block') {
      content.style.display = 'none';
      arrow.innerText = '▼';
    } else {
      content.style.display = 'block';
      arrow.innerText = '▲';
    }
  }

  function clearApiKey() {
    localStorage.removeItem('deepseek_api_key');
    document.getElementById('apiKey').value = '';
    document.getElementById('keyHeaderTitle').innerText = '🔑 DeepSeek API Key 設定';
    alert('已清除儲存的 API Key！');
  }

  /* --- 歷史紀錄邏輯 --- */
  function getHistory() {
    try {
      return JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
    } catch {
      return [];
    }
  }

  function saveToHistory(record) {
    let history = getHistory();
    history.unshift(record);
    if (history.length > 10) history = history.slice(0, 10);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
    renderHistoryDropdown();
  }

  function renderHistoryDropdown() {
    const history = getHistory();
    const select = document.getElementById('historySelect');
    select.innerHTML = '<option value="">-- 請選擇過往紀錄 --</option>';

    history.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item.id;
      opt.innerText = `[${item.time}] ${item.fileName} (${item.mode})`;
      select.appendChild(opt);
    });
  }

  function loadHistoryItem(id) {
    if (!id) return;
    const history = getHistory();
    const target = history.find(item => item.id == id);
    if (target) {
      rawMarkdownResult = target.content;
      document.getElementById('aiOutput').innerHTML = marked.parse(rawMarkdownResult);
    }
  }

  function clearHistory() {
    if (confirm('確定要清空所有歷史紀錄嗎？')) {
      localStorage.removeItem(HISTORY_KEY);
      renderHistoryDropdown();
      document.getElementById('aiOutput').innerHTML = '歷史紀錄已清空。';
      rawMarkdownResult = '';
    }
  }

  async function copyResult() {
    const copyBtn = document.getElementById('copyBtn');
    if (!rawMarkdownResult.trim()) return alert('目前沒有可複製的內容！');

    try {
      await navigator.clipboard.writeText(rawMarkdownResult);
      copyBtn.innerText = '✅ 已複製！';
      setTimeout(() => copyBtn.innerText = '📋 複製內容', 2000);
    } catch (err) {
      alert('複製失敗，請手動選取內容。');
    }
  }

  function getSystemPrompt(mode, lang) {
    const langInstruction = `Please write the response strictly in ${lang}.`;
    switch (mode) {
      case 'summary':
        return `You are a data analyst. Organize and summarize the text into: 1. Core Topic, 2. Key Bullet Points, 3. Key Data/Dates. Use Markdown. ${langInstruction}`;
      case 'structure':
        return `You are a data formatting expert. Extract all items, numbers, dates, or financial data into a clean Markdown Table. ${langInstruction}`;
      case 'proofread':
      default:
        return `You are a professional proofreader. Fix typos, correct grammar, and improve formatting using Markdown headings and lists. ${langInstruction}`;
    }
  }

  async function startOneStepOCR() {
    const file = selectedFile;
    const apiKey = document.getElementById('apiKey').value.trim();
    const mode = document.getElementById('promptMode').value;
    const targetLang = document.getElementById('targetLang').value;
    const statusText = document.getElementById('statusText');
    const progressBox = document.getElementById('progressBox');
    const progressBar = document.getElementById('progressBar');
    const aiOutput = document.getElementById('aiOutput');

    if (!file) return alert('請先選擇或拖曳圖片！');
    if (!apiKey) {
      document.getElementById('apiContent').style.display = 'block';
      return alert('請先展開並輸入 DeepSeek API Key！');
    }

    localStorage.setItem('deepseek_api_key', apiKey);
    document.getElementById('keyHeaderTitle').innerText = '🔑 DeepSeek API Key (已設定)';

    aiOutput.innerHTML = '<i>分析中...</i>';
    rawMarkdownResult = '';
    progressBox.style.display = 'block';
    progressBar.style.width = '0%';
    statusText.innerText = '🧱 準備中...';

    try {
      const worker = await Tesseract.createWorker('chi_tra+eng', 1, {
        logger: m => {
          if (m.status === 'recognizing text') {
            const pct = Math.round(m.progress * 100);
            progressBar.style.width = pct + '%';
            statusText.innerText = `🔍 圖片文字識別中... (${pct}%)`;
          }
        }
      });

      const ret = await worker.recognize(file);
      const rawText = ret.data.text;
      await worker.terminate();

      if (!rawText.trim()) throw new Error('未能從圖片中識別出任何文字。');

      progressBar.style.width = '100%';
      statusText.innerText = `🤖 DeepSeek 正在進行 [${targetLang}] 分析...`;

      const response = await fetch('https://api.deepseek.com/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${apiKey}`
        },
        body: JSON.stringify({
          model: "deepseek-chat",
          messages: [
            { role: "system", content: getSystemPrompt(mode, targetLang) },
            { role: "user", content: rawText }
          ]
        })
      });

      const data = await response.json();
      if (data.choices && data.choices.length > 0) {
        rawMarkdownResult = data.choices[0].message.content;
        aiOutput.innerHTML = marked.parse(rawMarkdownResult);
        statusText.innerText = '🎉 分析與渲染完成！';

        // 儲存至 LocalStorage 歷史紀錄
        const now = new Date();
        const timeStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
        saveToHistory({
          id: Date.now(),
          time: timeStr,
          fileName: file.name,
          mode: mode,
          lang: targetLang,
          content: rawMarkdownResult
        });

      } else {
        throw new Error(data.error?.message || 'DeepSeek 回傳異常數據');
      }

    } catch (err) {
      statusText.innerText = '❌ 發生錯誤';
      alert('處理失敗：' + err.message);
    } finally {
      setTimeout(() => { progressBox.style.display = 'none'; }, 2000);
    }
  }
</script>

</body>
</html>
